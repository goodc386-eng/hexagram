<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>핵사그램 성격유형 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a six-storey building. The result is read as floors, 1F = the type you use most, 6F = the type furthest from you. */
:root{
  --bg:#ffffff;
  --surface:#f3f7fd;
  --ink:#0e2246;
  --muted:#566783;
  --line:#d9e3f2;
  --blue:#1d63d6;
  --blue-soft:#d6e5fb;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;font-size:16px;word-break:keep-all}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 96px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:560px;margin:0 auto;padding:10px 18px 0}
.top-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.top-row b{color:var(--ink);font-weight:700}
.bar{height:4px;background:var(--blue-soft);margin:8px -18px 0}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .25s}
.hidden{display:none!important}

/* intro */
.hero{padding:36px 0 8px}
.eyebrow{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.02em}
.hero h1{font-size:34px;font-weight:900;margin:8px 0 14px;letter-spacing:-.02em}
.hero p.lead{color:var(--muted);font-size:16px}
.hero svg{display:block;width:100%;max-width:300px;margin:26px auto 6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.fact{background:var(--surface);border-radius:10px;padding:12px 8px;text-align:center}
.fact b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted)}
.rules{padding:0;margin:0 0 22px;list-style:none;display:grid;gap:8px}
.rules li{position:relative;padding-left:18px;font-size:14.5px;color:var(--ink)}
.rules li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;background:var(--blue)}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label{font-size:13px;font-weight:700}
.field input{font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.field input:focus-visible{outline:3px solid var(--blue-soft);border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 22px;border-radius:12px;border:1.5px solid var(--navy,#0e2246);background:var(--ink);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.block{width:100%}
.btn:focus-visible,.opt:focus-visible,.dot:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* questions */
.step-title{padding:22px 0 6px}
.step-title h2{font-size:20px;font-weight:900}
.step-title p{font-size:14px;color:var(--muted);margin-top:4px}
.q{padding:20px 0;border-bottom:1px solid var(--line)}
.q.missing{background:#fff6e6;margin:0 -18px;padding:20px 18px;border-bottom-color:#f0d9a8}
.qtext{display:flex;gap:10px;font-size:16px;font-weight:500;margin-bottom:14px}
.qn{flex:none;min-width:26px;height:26px;border-radius:6px;background:var(--surface);color:var(--blue);font-size:12.5px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:1px}
.scale{display:flex;justify-content:space-between;gap:6px}
.dot{flex:1;max-width:46px;aspect-ratio:1;border-radius:50%;border:1.5px solid #b9c8e2;background:#fff;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums;padding:0;transition:background .12s,color .12s}
.dot[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.nav{position:sticky;bottom:0;background:linear-gradient(to top,#fff 78%,rgba(255,255,255,0));padding:18px 0 14px;display:flex;gap:10px;margin-top:6px}
.nav .btn{flex:1}
.nav .btn.ghost{flex:0 0 96px}
.note{font-size:13px;color:#8a5a00;margin-top:8px;min-height:20px}

/* ranking */
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15px;cursor:pointer;line-height:1.5}
.opt .rk{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px dashed #b9c8e2;display:grid;place-items:center;font-weight:900;font-size:14px;color:transparent;font-variant-numeric:tabular-nums}
.opt.on{border-color:var(--blue);background:var(--surface)}
.opt.on .rk{border:none;background:var(--blue);color:#fff}
.opt.top1 .rk{background:var(--ink)}
.rank-tools{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:700;font-size:14px;cursor:pointer;padding:6px 0;text-decoration:underline}

/* result */
.res-head{padding:30px 0 8px}
.res-head .eyebrow{display:block}
.res-head h1{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:6px 0 10px}
.res-head p{color:var(--muted);font-size:15px}
.building{margin:22px 0 8px;border:2px solid var(--ink);border-radius:6px 6px 0 0;background:#fff;position:relative}
.roof{height:14px;background:var(--ink);margin:-2px -2px 0;border-radius:6px 6px 0 0}
.floor{display:grid;grid-template-columns:38px 62px 1fr 40px;gap:8px;align-items:center;padding:11px 12px;border-top:1px solid var(--line)}
.floor:first-of-type{border-top:none}
.floor .fl{font-weight:900;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.floor .tn{font-weight:700;font-size:14.5px}
.floor .tr{height:14px;background:var(--surface);border-radius:3px;position:relative;overflow:hidden}
.floor .tr i{position:absolute;inset:0 auto 0 0;background:#9db9e6;border-radius:3px}
.floor.f1 .tr i{background:var(--ink)}
.floor.f2 .tr i{background:var(--blue)}
.floor .sc{font-size:14px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.floor.f1 .sc,.floor.f2 .sc{color:var(--ink);font-weight:700}
.tie{display:inline-block;font-size:10.5px;font-weight:700;background:#fff0c9;color:#7a5200;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px}
.ground{height:6px;background:var(--ink);margin:0 -6px}
.legend{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.card{border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-top:16px;background:#fff}
.card.main{border-color:var(--ink)}
.card .badge{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--ink);border-radius:5px;padding:2px 8px;margin-bottom:8px}
.card.second .badge{background:var(--blue)}
.card h2{font-size:22px;font-weight:900}
.card .en{font-size:13px;color:var(--muted);font-weight:500;margin-left:6px}
.card .tag{font-size:15px;color:var(--ink);margin:6px 0 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;padding:12px 0;border-top:1px solid var(--line)}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;font-weight:500}
.sec{padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}
.sec h3{font-size:13.5px;color:var(--blue);margin-bottom:6px;font-weight:700}
.sec ul{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:3px}
.sec p{font-size:14.5px}
details{border:1.5px solid var(--line);border-radius:12px;margin-top:10px;background:#fff}
summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--blue);font-weight:400}
details[open] summary::after{content:"–"}
details .in{padding:0 16px 16px}
.far{background:var(--surface);border-radius:12px;padding:14px 16px;margin-top:16px;font-size:14.5px}
.far b{color:var(--ink)}
.elev{margin-top:22px;font-size:14px;color:var(--muted)}
.actions{display:grid;gap:10px;margin-top:26px}
.toast{font-size:13px;color:var(--blue);min-height:20px;text-align:center}
.fine{font-size:12.5px;color:var(--muted);margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
textarea.copybox{width:100%;height:160px;font:13px/1.5 var(--font);padding:10px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.floor{grid-template-columns:32px 56px 1fr 36px;gap:6px;padding:10px}.hero h1{font-size:30px}}
</style>
</head>
<body>

  <div class="top-in">
    <div class="top-row"><span id="stepLabel"></span><span id="stepCount"></span></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>
</header>
<main class="wrap" id="app"></main>

//SCORING-START
function computeScores(ans,bm,bn){
  // ans: array of 60 values (1..7), index 0 = question 1. bm/bn: type indices in rank order (1st, 2nd, ...)
  const s=[0,0,0,0,0,0];
  for(let q=1;q<=60;q++){
    const k=(q-1)%6;
    const v=Number(ans[q-1])||0;
    s[k]+=v*(HEAVY[k].includes(q)?1.5:1);
  }
  [bm,bn].forEach(r=>{ if(r&&r.length>0)s[r[0]]+=5; if(r&&r.length>1)s[r[1]]+=3; });
  return s;
}
//SCORING-END

function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function answered(){return S.ans.filter(v=>v>0).length+(S.bm.length===6?1:0)+(S.bn.length===6?1:0);}

function setTop(show,label,count){
  $("#top").classList.toggle("hidden",!show);
  if(show){$("#stepLabel").innerHTML=label;$("#stepCount").textContent=count;$("#barFill").style.width=Math.round(answered()/62*100)+"%";}
}
function go(screen,page){S.screen=screen;if(page!==undefined)S.page=page;snap();render();window.scrollTo(0,0);}

function viewQ(){

  let h=`<div class="step-title"><h2>요즘 일할 때의 나와 얼마나 비슷한가요?</h2><p>1 전혀 그렇지 않다 · 4 보통이다 · 7 매우 그렇다</p></div>`;
  for(let i=from;i<to;i++){
    const n=i+1;
    h+=`<div class="q" id="q${n}"><p class="qtext"><span class="qn">${n}</span><span>${esc(QUESTIONS[i])}</span></p>

    <div class="ends"><span>전혀 그렇지 않다</span><span>매우 그렇다</span></div></div>`;
  }
  h+=`<div class="note" id="note" role="status"></div>
  <div class="nav">${p>0?`<button class="btn ghost" id="prev">이전</button>`:`<button class="btn ghost" id="prev">처음</button>`}<button class="btn" id="next">다음</button></div>`;
  app.innerHTML=h;
  app.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q,v=+b.dataset.v;S.ans[i]=v;
    b.parentElement.querySelectorAll(".dot").forEach(x=>x.setAttribute("aria-checked",String(+x.dataset.v===v)));

    $("#note").textContent="";snap();
  });
  $("#prev").onclick=()=>p>0?go("q",p-1):go("intro");
  $("#next").onclick=()=>{
    const miss=[];for(let i=from;i<to;i++)if(!S.ans[i])miss.push(i+1);

    go(p+1<QPAGES?"q":"rank",p+1<QPAGES?p+1:0);
  };
}

  setTop(true,`<b>${QPAGES+1+S.page}</b> / ${TOTAL_STEPS} 단계`,isBM?"우선순위 ①":"우선순위 ②");
  let h=`<div class="step-title"><h2>${isBM?"소통할 때 내가 선호하는 방식은?":"일과 삶에서 내가 중요하게 여기는 것은?"}</h2><p>아래 6개 문장을 읽고, 자신이 가장 선호하는 것부터 차례로 눌러 1순위에서 6순위까지 정해 주세요. 잘못 눌렀다면 '순위 다시 정하기'를 누르세요.</p></div>

function ranked(){
  const sc=computeScores(S.ans,S.bm,S.bn);
  const list=sc.map((v,i)=>({i,v,n:TYPE_ORDER[i]})).sort((a,b)=>b.v-a.v||a.i-b.i);
  list.forEach(x=>x.tie=list.filter(y=>y.v===x.v).length>1);
  return {sc,list};
}

function fmt(v){return Number.isInteger(v)?String(v):v.toFixed(1);}

function detail(t,full){
  return `<dl class="kv"><dt>세상을 지각하는 방식</dt><dd>${t.perceive}</dd><dt>자산</dt><dd>${t.asset}</dd><dt>심리적 욕구</dt><dd>${t.need}</dd></dl>
  <div class="sec"><h3>강점</h3><ul>${t.strengths.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="sec"><h3>조심할 점</h3><ul>${t.watch.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="sec"><h3>이 유형과 소통할 때</h3><ul>${t.talk.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="sec"><h3>이 유형이 힘을 내려면</h3><ul>${t.motivate.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="sec"><h3>스트레스가 올라올 때의 신호</h3><p>${t.stress}</p></div>
  <div class="sec"><h3>스트레스 관리</h3><ul>${t.relief.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
}

function viewResult(){
  setTop(false);
  const {list}=ranked();
  const f1=list[0],f2=list[1],f6=list[5];
  const t1=typeOf(f1.n),t2=typeOf(f2.n),t6=typeOf(f6.n);
  const hasTie=list.some(x=>x.tie);
  const who=S.name?esc(S.name)+"님의 ":"나의 ";
  const maxShow=93;
  const floors=[...list].map((x,idx)=>({...x,fl:idx+1})).reverse();
  app.innerHTML=`
  <section class="res-head">
    <span class="eyebrow">핵사그램 퍼스널 빌딩</span>
    <h1>${who}1층은<br>${f1.n}${f1.tie&&list[1].v===f1.v?` · ${list[1].n}`:""}입니다</h1>
    <p>가장 자주 쓰는 기본 유형이 1층, 두 번째로 자주 쓰는 유형이 2층입니다. 6층으로 갈수록 평소에 쓰기 힘든 유형입니다.</p>
  </section>
  <div class="building" role="group" aria-label="유형별 점수를 층으로 나타낸 건물">
    <div class="roof"></div>
    ${floors.map(x=>`<div class="floor f${x.fl}"><span class="fl">${x.fl}F</span><span class="tn">${x.n}${x.tie?`<span class="tie">동점</span>`:""}</span><span class="tr"><i style="width:${Math.min(100,x.v/maxShow*100).toFixed(1)}%"></i></span><span class="sc">${fmt(x.v)}</span></div>`).join("")}
  </div>
  <div class="ground"></div>
  <p class="legend">막대는 점수(최대 93점 기준)입니다. ${hasTie?"동점인 유형은 같은 점수로 표시했으니 두 층을 함께 읽어 주세요. ":""}</p>

  <article class="card main">
    <span class="badge">1층 · 기본 유형</span>
    <h2>${t1.n}<span class="en">${t1.en}</span></h2>
    <p class="tag">${t1.tag}</p>
    ${detail(t1)}
  </article>
  <article class="card second">
    <span class="badge">2층 · 두 번째로 자주 쓰는 유형</span>
    <h2>${t2.n}<span class="en">${t2.en}</span></h2>
    <p class="tag">${t2.tag}</p>
    ${detail(t2)}
  </article>
  <div class="far"><b>6층 · ${t6.n}</b>은(는) 나와 가장 멀게 느껴지는 유형입니다. 이 유형의 동료와 일할 때는 ‘${t6.talk[0]}’처럼 상대가 편안해하는 방식을 의식적으로 써 보세요.</div>

  <h2 style="margin-top:28px;font-size:18px">다른 유형도 살펴보기</h2>
  ${list.slice(2).map((x,i)=>{const t=typeOf(x.n);return `<details><summary>${i+3}층 · ${t.n}</summary><div class="in"><p class="tag" style="margin:0 0 10px;font-size:14.5px">${t.tag}</p>${detail(t)}</div></details>`;}).join("")}

  <p class="elev">욕구가 채워지면 사람은 엘리베이터처럼 여러 층을 오가며 다양한 유형으로 소통할 수 있고, 채워지지 않으면 기본 유형의 스트레스 반응(지하층)이 나타납니다. 타입은 나를 가두는 이름이 아니라, 지금 어떤 방식으로 반응하는지 살펴보는 렌즈입니다.</p>

  <div class="actions">
    <button class="btn block" id="copy">결과 요약 복사하기</button>
    <div class="toast" id="toast" role="status"></div>
    <button class="btn ghost block" id="redo">처음부터 다시 하기</button>
  </div>
  <p class="fine">이 진단은 스스로 답한 응답을 바탕으로 한 참고 도구이며, 성격을 단정하거나 능력·적성을 평가하지 않습니다. 응답은 이 기기 안에서만 계산되고 저장·전송되지 않습니다.</p>`;
  $("#copy").onclick=async()=>{
    const txt=`[핵사그램 퍼스널 빌딩] ${S.name||""}\n`+floors.map(x=>`${x.fl}층 ${x.n} ${fmt(x.v)}점${x.tie?" (동점)":""}`).join("\n");
    try{await navigator.clipboard.writeText(txt);$("#toast").textContent="복사했습니다.";}
    catch(e){$("#toast").innerHTML=`복사가 막혀 있습니다. 아래 글을 직접 선택해 복사해 주세요.<textarea class="copybox" readonly id="cb">${esc(txt)}</textarea>`;const c=$("#cb");c.focus();c.select();}
  };
  $("#redo").onclick=()=>{ if(!$("#redo").dataset.sure){$("#redo").dataset.sure="1";$("#redo").textContent="응답이 모두 지워집니다. 한 번 더 누르면 처음부터 시작합니다.";return;}
    S={screen:"intro",page:0,ans:Array(60).fill(0),bm:[],bn:[],name:S.name,ordBM:shuffle(6),ordBN:shuffle(6)};snap();render();window.scrollTo(0,0);};
}

function render(){
  if(S.screen==="q")return viewQ();
  if(S.screen==="rank")return viewRank();
  if(S.screen==="result"){ if(S.bm.length<6||S.bn.length<6||S.ans.some(v=>!v)){S.screen="intro";return viewIntro();} return viewResult(); }
  viewIntro();
}
render();
</script>
</body>
</html>
